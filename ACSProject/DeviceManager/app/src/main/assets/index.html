<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeviceManager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1 style="color: green; text-align: center;">DeviceManager</h1> 
  <div class="device-list">
    <div class="device-list-item" id="no-device">
      <p style="color: gray;">No devices</p>
    </div>
  </div>

  <div class="bottom-controls">
    <input type="text" id="setDeviceNameInput" placeholder="Add new device...">
    <button id="newDeviceButton">Create</button>
    <button id="exportButton">Export</button>
    <button id="importButton">Import</button>
    <button id="deleteAllButton">Delete All</button>
  </div>

  <!-- Custom Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modalMessage">Message</h3>
      <input type="text" id="modalInput" class="modal-input hidden" placeholder="Enter value...">
      <div class="modal-actions">
        <button id="modalCancelBtn" class="modal-btn secondary hidden">Cancel</button>
        <button id="modalConfirmBtn" class="modal-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
